<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">Fotografía profesional pendiente</title>
  <desc id="desc">Espacio de 400 por 400 píxeles. Reemplazar por una fotografía profesional del estudiante.</desc>
  <rect x="1" y="1" width="398" height="398" fill="#f3f4f6" stroke="#8c929a" stroke-width="2"/>
  <rect x="35" y="35" width="330" height="330" rx="4" fill="white" stroke="#c5c9ce" stroke-dasharray="8 8"/>
  <g text-anchor="middle" fill="#40464f" font-family="Arial, sans-serif">
    <text x="200" y="161" font-size="19" font-weight="bold">FOTO PROFESIONAL</text>
    <text x="200" y="194" font-size="17">PENDIENTE</text>
    <text x="200" y="240" font-size="21">400 x 400 píxeles</text>
    <text x="200" y="275" font-size="14">Reemplaza este espacio con tu foto.</text>
  </g>
</svg>
